# 本地开发覆盖配置
# 自动被 docker-compose 读取，无需 -f 参数指定
version: "3.8"

services:
  api:
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - PYTHONDONTWRITEBYTECODE=1
    command: uvicorn api_server:app --host 0.0.0.0 --port 8000 --reload

  ui:
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0
